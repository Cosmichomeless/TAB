name: TAB
options:
  bundleIdPrefix: com.cosmichomeless
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  TABCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  # The App Store app: everything stays on the device. No sync code is compiled in or linked.
  TAB:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Sync
    dependencies:
      - package: TABCore
    info:
      path: App/Info.plist
      properties: &sharedInfo
        ITSAppUsesNonExemptEncryption: false
        # Strings live in App/Localizable.xcstrings; scripts/check_localizations.py keeps it complete.
        CFBundleLocalizations: [en, es, fr, it, pt, de]
        LSSupportsOpeningDocumentsInPlace: false
        # `tab://group?d=...` links and QR codes, and the .tabgroup / .tabbackup files (see Sources/TABCore/Sharing).
        CFBundleURLTypes:
          - CFBundleURLName: com.cosmichomeless.tab.link
            CFBundleURLSchemes: [tab]
        CFBundleDocumentTypes:
          - CFBundleTypeName: TAB group
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.cosmichomeless.tab.group]
          - CFBundleTypeName: TAB backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.cosmichomeless.tab.backup]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cosmichomeless.tab.group
            UTTypeDescription: TAB group
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [tabgroup]
              public.mime-type: [application/vnd.cosmichomeless.tab.group+json]
          - UTTypeIdentifier: com.cosmichomeless.tab.backup
            UTTypeDescription: TAB backup
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [tabbackup]
              public.mime-type: [application/vnd.cosmichomeless.tab.backup+json]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cosmichomeless.TAB
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: TAB
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPhone only: the layouts are phone layouts, and a universal build would need iPad orientations and screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
  # Accounts and sync (Supabase), compiled with the SYNC flag. Not shipped: kept so the sync work does not rot.
  TAB-Sync:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: TABCore
      - package: TABCore
        product: TABSync
    info:
      path: SyncApp/Info.plist
      properties:
        <<: *sharedInfo
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        # Injected per build (`xcodebuild SUPABASE_URL=... SUPABASE_ANON_KEY=...`); empty means offline only.
        SUPABASE_URL: ""
        SUPABASE_ANON_KEY: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SYNC"
        PRODUCT_BUNDLE_IDENTIFIER: com.cosmichomeless.TAB.sync
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: TAB Sync
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPhone only: the layouts are phone layouts, and a universal build would need iPad orientations and screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
  TABUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: TAB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cosmichomeless.TABUITests
